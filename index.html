<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" id="app-sidebar">
    <div id="project-name">
      <p>Company Assistant</p>
    </div>
    <div class="newchat-conversations">
      <div id="new-chat">
        <button >New Chat</button>
      </div>
      <div class="conversations">
      </div>
    </div>
  </aside>
  <div class="chat-window">
    <button id="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-controls="app-sidebar" aria-expanded="true" title="Collapse sidebar">☰</button>
    <div class="chat-area">
    </div>
    <form class="input-submit">
      <textarea class="input"></textarea>
      <button type="submit" class="submit"></button>
    </form>
  </div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

<script src="script.js"></script>
</body>
</html>
